const Q=1000000n;
function fp(v){let s=norm(v);if(!s)return 0n;if(/[eE]/.test(s))s=Number(s).toFixed(6);if(!/^\d+(\.\d{0,6})?$/.test(s))throw Error('عدد باید نامنفی و حداکثر شش رقم اعشار داشته باشد');let [a,b='']=s.split('.');return BigInt(a)*Q+BigInt((b+'000000').slice(0,6))}
function div(a,b){if(!b)throw Error('تقسیم بر صفر');return (a+b/2n)/b} function mul(a,b){return div(a*b,Q)}
function nfp(v){return Number(v)/1e6} function fmt(v,d=2){return Number(v).toLocaleString('fa-IR',{maximumFractionDigits:d,minimumFractionDigits:0})}
function percent(v,p,subtract=false){const x=fp(p);if(subtract&&x>100n*Q)throw Error('درصد تخفیف نمی‌تواند بیشتر از ۱۰۰ باشد');return div(v*(100n*Q+(subtract?-x:x)),100n*Q)}
function unitCost(r){let v=percent(fp(r.price),r.adjustment,r.adjustmentType==='کاهش');return r.unit==='کیلوگرم'?div(v,1000n):v}
function resourceFor(id){return db.resources.find(r=>r.id===id)} function recipeFor(id){return db.recipes.find(r=>r.id===id)}
function calculate(r){if(!r)return null;const y=fp(r.yield);if(y<=0n)throw Error('تعداد خروجی باید بیشتر از صفر باشد');let lines=[],sum=0n,feeBatch=0n,missing=[];for(const c of r.components){let item=resourceFor(c.resourceId);if(!item){missing.push('قلم حذف‌شده');continue}let u=unitCost(item);let total=percent(mul(u,fp(c.qty)),c.waste);sum+=total;if(c.feeSelected)feeBatch+=total;lines.push({c,item,unit:u,total});if(u===0n&&fp(c.qty)>0n&&!item.zeroConfirmed)missing.push(item.name)}sum+=fp(r.overhead);let unit=div(sum*Q,y);let feeUnit=div(feeBatch*Q,y);return {lines,sum,unit,factory:percent(unit,r.factoryMarkup),missing,feeBatch,feeUnit,feeDefined:!!r.feeDefined}}

 return `<div class="alert">${esc(db.settings.warning)} قیمت‌های اولیه از اکسل وارد شده‌اند؛ ارتباط‌های پیشنهادی و مقادیر را قبل از تصمیم مالی بررسی کنید.</div><div class="panel scroll"><h2>خلاصه اطلاعات</h2><table class="dashboard-summary">${heads(['عنوان','تعداد','مسیر بررسی'])}<tbody><tr><td>اقلام و کدها</td><td class="num">${fmt(db.resources.length)}</td><td><button data-go="resources">اقلام و کدها</button></td></tr><tr><td>فرمول‌های تولید</td><td class="num">${fmt(db.recipes.length)}</td><td><button data-go="recipes">فرمول تولید</button></td></tr><tr><td>محصولات</td><td class="num">${fmt(db.products.length)}</td><td><button data-go="products">محصولات و قیمت‌گذاری</button></td></tr><tr><td>اقلام با نرخ خرید صفر <span class="issue-detail">شامل اقلام مرجع و اقلامی که ممکن است واقعاً هزینه صفر داشته باشند</span></td><td class="num">${fmt(zero)}</td><td><button data-go="resources">بررسی در اقلام و کدها</button></td></tr></tbody></table></div><div class="panel scroll"><h2>موارد نیازمند بررسی <span class="badge">${fmt(issues.length)} مورد</span></h2><p class="muted">برای هر مورد، دلیل، محل رفع و دکمه دسترسی مستقیم آورده شده است. موارد ناموجود لزوماً خطا نیستند.</p><table class="dashboard-issues">${heads(['مورد و توضیح','مسیر بررسی و رفع','دسترسی سریع'])}<tbody>${issueRows}</tbody></table></div><div class="panel scroll"><h2>مسیر کار</h2><table>${heads(['مرحله','محل انجام','اقدام'])}<tbody><tr><td>۱</td><td>اقلام و کدها</td><td>قیمت مواد و خدمات و نرخ صفر را بررسی کنید.</td></tr><tr><td>۲</td><td>فرمول تولید</td><td>مقدار مصرف، ضایعات، سربار و اجزای فی هزینه‌شده را کنترل کنید.</td></tr><tr><td>۳</td><td>محصولات و قیمت‌گذاری</td><td>فرمول و ضریب را برای هر محصول تعیین کنید.</td></tr><tr><td>۴</td><td>لیست قیمت</td><td>سود هر محصول را جداگانه ذخیره و خروجی را بررسی کنید.</td></tr></tbody></table></div>`
}
function tools(addlabel,addaction){return `<div class="toolbar"><input id="search" placeholder="جست‌وجو در نام، کد یا گروه…" value="${esc(search)}"><span class="spacer"></span><button class="primary" data-action="${addaction}">＋ ${addlabel}</button></div>`}
function filtered(x){return !search||norm(JSON.stringify(x)).toLowerCase().includes(norm(search).toLowerCase())}
function resourcesView(){let a=db.resources.filter(filtered);return `${tools('قلم جدید','new-resource')}<div class="panel scroll"><table>${heads(['کد','نام قلم','گروه','واحد خرید','نرخ خرید','تعدیل','نرخ مصرف','عملیات'])}<tbody>${a.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.category)}</td><td>${esc(r.unit)}</td><td class="num">${number(r.price)}</td><td>${esc(r.adjustmentType)} ${number(r.adjustment)}٪</td><td class="num">${money(unitCost(r))} / ${r.unit==='کیلوگرم'?'گرم':esc(r.unit)}</td><td class="actions"><button data-action="edit-resource" data-id="${esc(r.id)}">ویرایش</button> <button class="danger" data-action="delete-resource" data-id="${esc(r.id)}">حذف</button></td></tr>`).join('')}</tbody></table><p class="muted">${fmt(a.length)} قلم نمایش داده شده است. برای خرید کیلویی، نرخ مصرف به ازای هر گرم محاسبه می‌شود.</p></div>`}
function recipesView(){let a=db.recipes.filter(filtered);return `${tools('فرمول جدید','new-recipe')}<div class="panel scroll"><table>${heads(['کد','فرمول','اجزا','خروجی بچ','بهای واحد','فی هزینه‌شده واحد','سود کارخانه','فروش کارخانه','عملیات'])}<tbody>${a.map(r=>{let c=calculate(r);return `<tr><td>${esc(r.code)}</td><td>${esc(r.name)} ${c.missing.length?'<span class="notice">⚠ نرخ صفر</span>':''}</td><td>${fmt(r.components.length)}</td><td>${number(r.yield)}</td><td class="num">${money(c.unit)}</td><td class="num">${c.feeDefined?money(c.feeUnit):'تعریف نشده'}</td><td>${number(r.factoryMarkup)}٪</td><td class="num">${money(c.factory)}</td><td class="actions"><button data-action="edit-recipe" data-id="${esc(r.id)}">ویرایش</button> <button data-action="report-recipe" data-id="${esc(r.id)}">گزارش</button> <button class="danger" data-action="delete-recipe" data-id="${esc(r.id)}">حذف</button></td></tr>`}).join('')}</tbody></table></div>`}
function productsView(){let a=db.products.filter(filtered);return `${tools('محصول جدید','new-product')}<div class="panel scroll"><table>${heads(['کد','محصول','فرمول متصل','ضریب محصول','بهای تولید','فی هزینه‌شده محصول','قیمت کارخانه','وضعیت','عملیات'])}<tbody>${a.map(p=>{let c=calcProduct(p);return `<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(c?c.r.name:'— ثبت نشده')}</td><td>${number(p.multiplier)}</td><td class="num">${c?money(c.cost):'—'}</td><td class="num">${c&&c.c.feeDefined?money(c.feeProduct):'تعریف نشده'}</td><td class="num">${c?money(c.factory):'—'}</td><td>${p.available?'موجود':'ناموجود'}</td><td class="actions"><button data-action="edit-product" data-id="${esc(p.id)}">ویرایش</button> <button class="danger" data-action="delete-product" data-id="${esc(p.id)}">حذف</button></td></tr>`}).join('')}</tbody></table><p class="muted">سود و قیمت نهایی لیست در بخش جداگانه «لیست قیمت» محاسبه می‌شوند.</p></div>`}
function parseMarkup(v){if(!norm(v))throw Error('درصد سود خالی است');let n=fp(v);if(n>1000000n*Q)throw Error('درصد سود از محدوده مجاز بیشتر است');return n}
function draftMarkup(p){return Object.prototype.hasOwnProperty.call(markupDrafts,p.id)?markupDrafts[p.id]:p.priceMarkup}
function listInfo(p){let c=calcProduct(p),final=null,invalid=false;try{let m=parseMarkup(draftMarkup(p));if(c)final=percent(c.factory,nfp(m))}catch{invalid=true}let reason=!p.available?'ناموجود':!c?'فرمول تعریف نشده':invalid?'درصد سود نامعتبر':c.c.missing.length?'نیاز به تکمیل نرخ':c.factory<=0n?'قیمت تعریف نشده':'';return {c,final,reason,invalid}}
function pricelistView(){let a=db.products.map(p=>({p,...listInfo(p)}));let problems=a.filter(x=>x.p.available&&x.reason).length;let dt=new Date().toLocaleDateString('fa-IR');return `<div class="panel"><h2>سود جداگانه هر محصول</h2><div class="toolbar"><span class="muted">درصد سود را در ردیف همان محصول وارد کنید. پیش‌نمایش فوری است؛ برای ثبت، دکمه ذخیره همان ردیف یا «ذخیره همه تغییرات» را بزنید. قیمت نهایی = قیمت کارخانه × (۱ + سود همان محصول).</span><span class="spacer"></span><button class="primary" data-action="save-all-markups">ذخیره همه تغییرات</button></div></div>${problems?`<div class="alert">${fmt(problems)} محصولِ موجود برای قیمت‌گذاری به تکمیل فرمول یا نرخ نیاز دارد. عدد محاسباتی آنها در جدول داخلی آزمایشی است و در خروجی مشتری به‌صورت وضعیت نیاز به بررسی نمایش داده می‌شود. نرخ صفر واقعی را در ویرایش قلم تأیید کنید.</div>`:''}<div class="panel scroll internal-price-panel"><h2>محاسبات داخلی لیست قیمت</h2><table class="internal-prices">${heads(['کد','نام محصول','بهای تولید','فی هزینه‌شده محصول','قیمت کارخانه','اختلاف کارخانه از تولید','سود لیست','قیمت نهایی لیست','وضعیت'])}<tbody>${a.map(({p,c,final,reason})=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td class="num">${c?money(c.cost):'—'}</td><td class="num">${c&&c.c.feeDefined?money(c.feeProduct):'تعریف نشده'}</td><td class="num">${c?money(c.factory):'—'}</td><td>${c&&c.cost>0n?fmt(Number(c.factory-c.cost)*100/Number(c.cost),2)+'٪':'—'}</td><td><div class="markup-entry"><input inputmode="decimal" aria-label="درصد سود ${esc(p.name)}" data-product-markup="${esc(p.id)}" value="${esc(draftMarkup(p))}"><span>٪</span><button data-action="save-markup" data-id="${esc(p.id)}">ذخیره</button></div><span class="muted">ثبت‌شده: ${number(p.priceMarkup)}٪</span></td><td class="num">${final!==null?money(final):'—'}</td><td>${esc(reason||'آماده')}</td></tr>`).join('')}</tbody></table><p class="muted">اختلاف درصد = (قیمت کارخانه − بهای تولید) ÷ بهای تولید × ۱۰۰. فی هزینه‌شده تنها جهت اطلاع است و دوباره به قیمت کارخانه اضافه نمی‌شود. همه مبالغ ریال هستند.</p><p class="muted">برای جلوگیری از ارائه پیش‌نویس، قبل از چاپ یا CSV همه درصدهای تغییرکرده را ذخیره کنید.</p></div><div class="toolbar"><h2>خروجی لیست قیمت مشتری</h2><span class="spacer"></span><button data-action="export-price-csv">خروجی CSV لیست قیمت</button><button class="primary" data-action="print-price-list">چاپ / ذخیره PDF لیست</button></div><section id="priceOutput" class="price-sheet"><div class="price-sheet-header"><div><div class="price-brand">◈ ${esc(db.settings.company||'افراز پلیمر')}</div><div class="price-kicker">گروه صنایع تولیدی</div></div><div class="price-heading"><div class="price-label">PRODUCT PRICE LIST</div><h2>لیست قیمت محصولات</h2><span>تاریخ تهیه: ${esc(dt)} &nbsp; | &nbsp; واحد: ریال</span></div></div><div class="price-accent"></div><table class="customer-table"><thead><tr><th>ردیف</th><th>کد محصول</th><th>نام محصول</th><th>قیمت نهایی (ریال)</th></tr></thead><tbody>${a.map(({p,final,reason},i)=>`<tr><td>${fmt(i+1)}</td><td class="code">${esc(p.code)}</td><td>${esc(p.name)}</td><td class="price-val">${reason?esc(reason):(final!==null?money(final):'—')}</td></tr>`).join('')}</tbody></table><div class="price-footer"><span>${esc(db.settings.company||'افراز پلیمر')}</span><span>لیست قیمت محصولات · ${esc(dt)}</span></div></section>`}

function usersView(){return `<div class="alert">همه کاربران این فضا دسترسی یکسان دارند: می‌توانند اطلاعات، کاربران و پشتیبان را تغییر دهند. فقط افراد مورد اعتماد را اضافه کنید.</div><div class="panel"><h2>حساب فعلی</h2><p>${esc(currentUser?.username||'')}</p><button data-action="cloud-logout">خروج از حساب</button></div><div class="panel"><h2>افزودن کاربر</h2><form id="createUserForm"><div class="formgrid two"><label>نام کاربری (۳ تا ۵۰ نویسه؛ حروف، عدد، نقطه، خط تیره یا @)<input name="username" required minlength="3" maxlength="50" autocomplete="off"></label><label>گذرواژه مستقل (حداقل ۱۲ نویسه)<input type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"></label></div><div class="toolbar"><button class="primary" type="submit">افزودن کاربر</button></div></form></div><div class="panel"><h2>تغییر گذرواژه من</h2><form id="changePasswordForm"><div class="formgrid two"><label>گذرواژه فعلی<input type="password" name="currentPassword" required maxlength="128" autocomplete="current-password"></label><label>گذرواژه جدید (حداقل ۱۲ نویسه)<input type="password" name="newPassword" required minlength="12" maxlength="128" autocomplete="new-password"></label></div><div class="toolbar"><button type="submit">تغییر گذرواژه</button></div></form><p class="muted">با تغییر گذرواژه، سایر نشست‌های همین حساب بسته می‌شوند.</p></div><div class="panel scroll"><h2>کاربران</h2><table>${heads(['نام کاربری','حساب فعلی','عملیات'])}<tbody>${userList.map(u=>`<tr><td>${esc(u.username)}</td><td>${u.id===currentUser?.userId?'بله':'خیر'}</td><td class="actions">${u.id===currentUser?.userId?'حساب جاری':`<button class="danger" data-action="remove-cloud-user" data-id="${esc(u.id)}">حذف دسترسی</button>`}</td></tr>`).join('')}</tbody></table></div>`}
async function refreshUsers(){try{let r=await fetch('/api/users');if(r.status===401){location.assign('/login');return}if(!r.ok)throw Error('دریافت کاربران ناموفق بود');let x=await r.json();userList=x.users;if(page==='users')render()}catch(e){notify(e.message,true)}}
async function cloudRequest(url,method,body){let r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-Afraz-Token':TOKEN},body:body?JSON.stringify(body):undefined});if(r.status===401){location.assign('/login');throw Error('نشست پایان یافته است')}let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'عملیات ناموفق بود');return x}
document.addEventListener('submit',async e=>{if(e.target.id==='createUserForm'){e.preventDefault();let f=e.target;try{await cloudRequest('/api/users','POST',{username:f.elements.username.value.trim(),password:f.elements.password.value});f.reset();notify('کاربر افزوده شد');await refreshUsers()}catch(err){alert(err.message)}}else if(e.target.id==='changePasswordForm'){e.preventDefault();let f=e.target;try{await cloudRequest('/api/password','POST',{currentPassword:f.elements.currentPassword.value,newPassword:f.elements.newPassword.value});f.reset();notify('گذرواژه تغییر کرد')}catch(err){alert(err.message)}}});
function reportHTML(id){let r=recipeFor(id)||db.recipes[0];if(!r)return empty('فرمولی ثبت نشده است.');let c=calculate(r);return `<div class="toolbar"><label style="min-width:280px">انتخاب فرمول<select id="reportSelect">${db.recipes.map(x=>`<option value="${esc(x.id)}" ${x.id===r.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><span class="spacer"></span><button onclick="window.print()">چاپ / ذخیره PDF</button></div>${c.missing.length?`<div class="alert">هشدار: نرخ این اقلام صفرِ تأییدنشده است یا قابل یافتن نیست: ${esc(c.missing.join('، '))}. خروجی را تا تکمیل اطلاعات نهایی تلقی نکنید.</div>`:''}<div class="panel scroll"><h2>خلاصه محاسبات</h2><table class="report-summary">${heads(['بهای کل بچ (ریال)','خروجی بچ','بهای تمام‌شده هر واحد (ریال)','فروش کارخانه هر واحد (ریال)'])}<tbody><tr><td class="num">${money(c.sum)}</td><td class="num">${number(r.yield)}</td><td class="num">${money(c.unit)}</td><td class="num">${money(c.factory)}<span class="issue-detail">با افزایش ${number(r.factoryMarkup)}٪</span></td></tr></tbody></table></div><div class="panel"><h2>فی هزینه‌شده</h2>${c.feeDefined?`<table class="fee-summary">${heads(['جمع اجزای تیک‌خورده در بچ (ریال)','فی هزینه‌شده هر واحد سالم (ریال)','تعداد اجزای انتخاب‌شده'])}<tbody><tr><td class="num">${money(c.feeBatch)}</td><td class="num">${money(c.feeUnit)}</td><td class="num">${fmt(c.lines.filter(l=>l.c.feeSelected).length)}</td></tr></tbody></table><p class="muted">این مبلغ بخشی از بهای تمام‌شده است، نه هزینه‌ای اضافه بر آن؛ سربار ثابت بچ در این جمع نیست.</p>`:'<p class="notice">برای این فرمول فی هزینه‌شده تعریف نشده است. از ویرایش فرمول، اجزای موردنظر را تیک بزنید.</p>'}${r.sourceFeeFormula?`<details><summary>فرمول اولیه اکسل — فقط برای مرجع</summary><p dir="ltr">${esc(r.sourceFeeCell)}: ${esc(r.sourceFeeFormula)}</p><p class="muted">پس از تغییر تیک‌ها یا اجزا، فرمول اولیه بالا مبنای محاسبه جاری نیست.</p></details>`:''}</div><div class="panel scroll"><h2>جزئیات ${esc(r.name)}</h2><table>${heads(['قلم','گروه','واحد مصرف','نرخ مصرف','مقدار در بچ','ضایعات','هزینه در بچ','در فی هزینه‌شده','سهم از کل'])}<tbody>${c.lines.map(l=>`<tr><td>${esc(l.item.name)}</td><td>${esc(l.item.category)}</td><td>${l.item.unit==='کیلوگرم'?'گرم':esc(l.item.unit)}</td><td class="num">${money(l.unit)}</td><td class="num">${number(l.c.qty)}</td><td>${number(l.c.waste)}٪</td><td class="num">${money(l.total)}</td><td>${l.c.feeSelected?'✓ انتخاب‌شده':'—'}</td><td>${c.sum?fmt(Number(l.total)*100/Number(c.sum),2):'۰'}٪</td></tr>`).join('')}<tr><td>سربار ثابت بچ</td><td>سربار</td><td>بچ</td><td>—</td><td>۱</td><td>—</td><td class="num">${number(r.overhead)}</td><td>—</td><td>${c.sum?fmt(Number(fp(r.overhead))*100/Number(c.sum),2):'۰'}٪</td></tr></tbody></table><p class="muted">${esc(r.note||'')}</p></div>`}
function backupView(){return `<div class="alert">اطلاعات در پایگاه داده ابری نگهداری می‌شوند. به‌طور مرتب نسخه پشتیبان جداگانه تهیه کنید و آن را در محلی امن نگه دارید.</div><div class="panel"><h2>پشتیبان و بازیابی</h2><p>نسخه پشتیبان JSON شامل اطلاعات عملیاتی است، اما حساب‌های کاربری و گذرواژه‌ها را شامل نمی‌شود. پشتیبان پایگاه داده و پشتیبان JSON مکمل یکدیگرند.</p><div class="stack"><button class="primary" data-action="export-backup">دریافت نسخه پشتیبان JSON</button><button data-action="import-backup">بازیابی از فایل پشتیبان</button><button data-action="export-csv">خروجی CSV محصولات</button></div><p class="muted">بازیابی جایگزین تمام اطلاعات فعلی می‌شود؛ ابتدا پشتیبان بگیرید.</p></div><div class="panel"><h2>قواعد محاسبه</h2><p>• نرخ مصرف = نرخ خرید پس از افزایش یا کسر درصد؛ برای خرید کیلویی تقسیم بر ۱۰۰۰ می‌شود.<br>• هزینه هر ردیف بچ = نرخ مصرف × مقدار مصرف × (۱ + درصد ضایعات).<br>• فی هزینه‌شده بچ = جمع هزینه ردیف‌های تیک‌خورده؛ فی هر واحد = جمع بچ ÷ خروجی سالم. سربار ثابت و سود به آن اضافه نمی‌شوند.<br>• بهای واحد = (جمع هزینه ردیف‌ها + سربار ثابت بچ) ÷ تعداد خروجی سالم بچ.<br>• قیمت کارخانه = بهای واحد × ضریب محصول × (۱ + سود کارخانه).<br>• قیمت نهایی هر محصول = قیمت کارخانه همان محصول × (۱ + درصد سود ثبت‌شده برای همان محصول). اختلاف درصد کارخانه نسبت به بهای تولید، بر مبنای بهای تولید محاسبه می‌شود.<br>• محاسبات داخلی با دقت شش رقم اعشار و گردکردن در هر مرحله انجام می‌شود؛ نمایش مالی تا دو رقم اعشار است. مالیات، استهلاک، حقوق و سایر هزینه‌ها خودکار برآورد نمی‌شوند؛ آنها را در اقلام یا سربار ثبت کنید.</p></div><div class="panel"><h2>محدودیت‌ها و انتقال از اکسل</h2><p>این نسخه نرم‌افزار محاسبه بهای محصول و قیمت‌گذاری است؛ دفتر کل، اسناد حسابداری، انبار تعدادی، چندکاربره و محاسبه خودکار مالیات ندارد. اطلاعات اکسل از شیت‌های اصلی، کد تولید، منو تولید و قیمت مشتری استخراج شده است. فایل اکسل اصلی را جداگانه نگه دارید؛ تصاویر و قالب‌بندی آن داخل برنامه بازسازی نشده‌اند. ارتباط برخی کالاها با فرمول بر اساس نام و ساختار اکسل پیشنهاد شده و باید تأیید شود.</p><p>نرخ‌های دستی بلوک ZCS به‌صورت اقلام مستقل وارد شده‌اند. مبلغ بسته‌بندی در فرمول هیدرولیک لحاظ شده و خطای «ناموجود» از محاسبات عددی جدا شده است. تفاوت قیمت درب آب تیبا به‌طور خودکار حل نشده؛ فرمول شیت «منو تولید» مبنا قرار گرفته است.</p></div><div class="panel"><details><summary>آخرین تغییرات ثبت‌شده</summary><p class="muted">${(db.audit||[]).slice(0,30).map(a=>`${esc(a.date)} — ${esc(a.actor||'')} — ${esc(a.description)}`).join('<br>')||'تغییری ثبت نشده است.'}</p></details></div>`}
function applyTableLabels(){document.querySelectorAll('#content table').forEach(table=>{let labels=Array.from(table.querySelectorAll('thead th'),th=>th.textContent.trim());table.querySelectorAll('tbody > tr').forEach(row=>{Array.from(row.children).forEach((cell,i)=>{if(cell.tagName==='TD')cell.dataset.label=labels[i]||''})})})}
function render(){nav();$('#title').textContent=pages[page][0];$('#subtitle').textContent=pages[page][1];try{$('#content').innerHTML=page==='dashboard'?dashboard():page==='resources'?resourcesView():page==='recipes'?recipesView():page==='products'?productsView():page==='pricelist'?pricelistView():page==='reports'?reportHTML(window.reportId):page==='users'?usersView():backupView()}catch(e){$('#content').innerHTML=`<div class="alert">خطا در نمایش اطلاعات: ${esc(e.message)}</div>`}applyTableLabels();let s=$('#search');if(s)s.addEventListener('input',()=>{let pos=s.selectionStart;search=s.value;render();let n=$('#search');n.focus();n.setSelectionRange(pos,pos)});let sel=$('#reportSelect');if(sel)sel.onchange=()=>{window.reportId=sel.value;render()}}
function field(label,name,val,opt={}){let req=opt.required?'required':'';return `<label class="${opt.full?'full':''}">${esc(label)}<input name="${esc(name)}" value="${esc(val)}" ${req} ${opt.num?'inputmode="decimal"':''} ${opt.hint?`title="${esc(opt.hint)}"`:''}></label>`}
function select(label,name,val,opts,full=false){return `<label class="${full?'full':''}">${esc(label)}<select name="${esc(name)}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
const categories=['مواد اولیه','نیمه‌ساخته','قطعات مصرفی','خدمات','هزینه','نام تولیدی','طرف حساب / فرمول','سایر'];
const units=['عدد','کیلوگرم','گرم','متر','ساعت','بسته','لیتر','دست','سرویس'];
function dlg(title,html){$('#modalContent').innerHTML=`<form id="form"><div class="modal-head"><h2>${esc(title)}</h2><button type="button" data-action="close-modal">✕</button></div><div class="modal-body">${html}</div><div class="modal-foot"><button type="submit" class="primary">ذخیره تغییرات</button><button type="button" data-action="close-modal">انصراف</button><span class="muted">مقادیر عددی باید نامنفی باشند.</span></div></form>`;if(!$('#modal').open)$('#modal').showModal();$('#form').addEventListener('submit',submitForm)}
function openResource(id){let x=id?structuredClone(getById(db.resources,id)):{id:uid(),code:'',name:'',category:'مواد اولیه',unit:'عدد',price:0,adjustment:0,adjustmentType:'افزایش',vendor:'',date:'',quantity:0,note:''};editing={type:'resource',id:id||null,draft:x};dlg(id?'ویرایش قلم':'افزودن قلم',`<div class="formgrid">${field('نام قلم','name',x.name,{required:true})}${field('کد','code',x.code)}${select('گروه','category',x.category,[...new Set([...categories,x.category])].map(v=>[v,v]))}${select('واحد نرخ خرید','unit',x.unit,units.map(v=>[v,v]))}${field('نرخ خرید (ریال)','price',x.price,{num:true,required:true})}${select('نوع تعدیل قیمت','adjustmentType',x.adjustmentType,[['افزایش','افزایش'],['کاهش','کاهش / تخفیف']])}${field('درصد تعدیل','adjustment',x.adjustment,{num:true,required:true})}${field('تأمین‌کننده','vendor',x.vendor)}${field('تاریخ خرید (متن)','date',x.date)}${field('مقدار خرید ثبت‌شده (صرفاً اطلاع)','quantity',x.quantity,{num:true,required:true})}${select('آیا نرخ صفر این قلم عمداً تأیید شده است؟','zeroConfirmed',x.zeroConfirmed?'1':'0',[['0','خیر؛ صفر نیاز به بررسی دارد'],['1','بله؛ هزینه صفر صحیح است']])}${field('توضیحات','note',x.note,{full:true})}</div><p class="muted">اگر واحد خرید کیلوگرم باشد، مقدار مصرف در فرمول باید به گرم وارد شود. مقدار خرید فعلاً موجودی انبار یا گردش کالا نیست.</p>`)}
function compRows(x){return x.components.map((c,i)=>`<div class="component" data-index="${i}"><label>قلم<select name="res-${i}" required><option value="">انتخاب قلم</option>${db.resources.map(v=>`<option value="${esc(v.id)}" ${v.id===c.resourceId?'selected':''}>${esc(v.code?`[${v.code}] `:'')}${esc(v.name)} — ${esc(v.category)} / ${v.unit==='کیلوگرم'?'گرم':esc(v.unit)}</option>`).join('')}</select></label><label>مقدار در بچ<input name="qty-${i}" inputmode="decimal" value="${esc(c.qty)}" required></label><label>ضایعات ٪<input name="waste-${i}" inputmode="decimal" value="${esc(c.waste)}" required></label><label class="fee-check"><input type="checkbox" name="fee-${i}" data-fee-check ${c.feeSelected?'checked':''}> فی هزینه‌شده</label><button type="button" class="danger" data-action="remove-component" data-index="${i}">حذف</button></div>`).join('')}
function drawRecipe(){let x=editing.draft;dlg(editing.id?'ویرایش فرمول تولید':'افزودن فرمول تولید',`<div class="formgrid">${field('نام فرمول','name',x.name,{required:true})}${field('کد فرمول','code',x.code)}${field('تعداد خروجی سالم بچ','yield',x.yield,{num:true,required:true})}${field('سربار ثابت هر بچ (ریال)','overhead',x.overhead,{num:true,required:true})}${field('افزایش / سود کارخانه ٪','factoryMarkup',x.factoryMarkup,{num:true,required:true})}${field('توضیحات','note',x.note)}${select('وضعیت فی هزینه‌شده','feeDefined',x.feeDefined?'1':'0',[['0','تعریف نشده'],['1','فعال']])}</div><p class="muted">مقدار اقلام کیلویی را بر حسب گرم و مقدار سایر اقلام را بر حسب واحد انتخابی وارد کنید. هر ردیف قابل ویرایش است.</p><div id="components">${compRows(x)}</div><button type="button" data-action="add-component">＋ افزودن جزء</button><div class="alert" id="feePreview">برای محاسبه فی هزینه‌شده، اجزای موردنظر را تیک بزنید.</div>`);updateFeePreview()}
function openRecipe(id){editing={type:'recipe',id:id||null,draft:id?structuredClone(getById(db.recipes,id)):{id:uid(),name:'',code:'',yield:1,overhead:0,factoryMarkup:0,note:'',feeDefined:false,sourceFeeCell:'',sourceFeeFormula:'',components:[]}};drawRecipe()}
function recipeDraftFromForm(){let x=editing.draft, f=$('#form');for(let k of ['name','code','yield','overhead','factoryMarkup','note'])x[k]=f.elements[k].value;x.feeDefined=f.elements.feeDefined.value==='1';x.components.forEach((c,i)=>{c.resourceId=f.elements['res-'+i].value;c.qty=f.elements['qty-'+i].value;c.waste=f.elements['waste-'+i].value;c.feeSelected=f.elements['fee-'+i].checked})}
function updateFeePreview(){let f=$('#form'),box=$('#feePreview');if(!f||!box||!editing||editing.type!=='recipe')return;try{if(f.elements.feeDefined.value!=='1'){box.textContent='فی هزینه‌شده تعریف نشده است؛ با تیک‌زدن یک جزء، محاسبه آن فعال می‌شود.';return}let sum=0n,count=0;for(let i=0;i<editing.draft.components.length;i++){if(!f.elements['fee-'+i].checked)continue;count++;let r=resourceFor(f.elements['res-'+i].value);if(!r)continue;sum+=percent(mul(unitCost(r),fp(f.elements['qty-'+i].value)),f.elements['waste-'+i].value)}let y=fp(f.elements.yield.value);if(y<=0n)throw Error('خروجی بچ باید مثبت باشد');box.textContent=`فی هزینه‌شده انتخابی: ${money(sum)} ریال در بچ؛ ${money(div(sum*Q,y))} ریال برای هر واحد سالم (${fmt(count)} جزء). این مبلغ به بهای تولید اضافه نمی‌شود.`}catch(e){box.textContent='برای پیش‌نمایش فی، مقادیر معتبر و خروجی بچ مثبت وارد کنید.'}}
function openProduct(id){let x=id?structuredClone(getById(db.products,id)):{id:uid(),code:'',name:'',recipeId:'',multiplier:1,marketMarkup:0,listPrice:0,available:true,discount:0,priceMarkup:0,note:''};editing={type:'product',id:id||null,draft:x};dlg(id?'ویرایش محصول':'افزودن محصول',`<div class="formgrid">${field('نام محصول','name',x.name,{required:true})}${field('کد محصول','code',x.code,{required:true})}${select('فرمول مرتبط','recipeId',x.recipeId,[['','بدون ارتباط'],...db.recipes.map(r=>[r.id,r.name])])}${field('تعداد واحد فرمول در محصول','multiplier',x.multiplier,{num:true,required:true})}${select('وضعیت','available',x.available?'1':'0',[['1','موجود'],['0','ناموجود']])}${field('توضیحات','note',x.note)}</div><p class="muted">برای محصول سه‌عددی، ضریب ۳ و برای محصول تکی ۱ وارد کنید. سود لیست از بخش «لیست قیمت» تنظیم می‌شود.</p>`)}
function text(f,n){return f.elements[n].value.trim()}
function num(f,n,limit=100000000000){let s=norm(text(f,n));let v=fp(s);if(v>BigInt(limit)*Q)throw Error('مقدار «'+n+'» از محدوده مجاز بیشتر است.');return Number(v)/1e6}
async function submitForm(ev){ev.preventDefault();try{const f=ev.currentTarget,x=structuredClone(editing.draft),next=copy();if(editing.type==='resource'){for(let k of ['name','code','category','unit','adjustmentType','vendor','date','note'])x[k]=text(f,k);for(let k of ['price','adjustment','quantity'])x[k]=num(f,k);x.zeroConfirmed=text(f,'zeroConfirmed')==='1';if(!x.name)throw Error('نام قلم الزامی است.');if(x.adjustmentType==='کاهش'&&x.adjustment>100)throw Error('درصد تخفیف نمی‌تواند بیش از ۱۰۰ باشد.');let i=next.resources.findIndex(v=>v.id===x.id);if(i<0)next.resources.push(x);else next.resources[i]=x}
else if(editing.type==='recipe'){for(let k of ['name','code','note'])x[k]=text(f,k);for(let k of ['yield','overhead','factoryMarkup'])x[k]=num(f,k);if(!x.name||x.yield<=0)throw Error('نام و خروجی مثبت برای فرمول الزامی است.');x.feeDefined=text(f,'feeDefined')==='1';x.components=x.components.map((c,i)=>({id:c.id,resourceId:text(f,'res-'+i),qty:num(f,'qty-'+i),waste:num(f,'waste-'+i),feeSelected:f.elements['fee-'+i].checked}));if(x.components.some(c=>!next.resources.some(r=>r.id===c.resourceId)))throw Error('برای همه ردیف‌ها قلم انتخاب کنید.');let i=next.recipes.findIndex(v=>v.id===x.id);if(i<0)next.recipes.push(x);else next.recipes[i]=x}
else {for(let k of ['name','code','recipeId','note'])x[k]=text(f,k);x.multiplier=num(f,'multiplier');x.available=text(f,'available')==='1';if(!x.name||!x.code||x.multiplier<=0)throw Error('نام، کد و ضریب مثبت محصول الزامی است.');if(x.discount>100)throw Error('تخفیف بیش از ۱۰۰ درصد مجاز نیست.');if(next.products.some(p=>p.id!==x.id&&p.code===x.code))throw Error('کد محصول تکراری است.');let i=next.products.findIndex(v=>v.id===x.id);if(i<0)next.products.push(x);else next.products[i]=x}
if(await persist(next,'ثبت یا ویرایش '+x.name)){$('#modal').close();editing=null}}catch(e){alert(e.message)}}
function download(name,data,type){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function validateData(d){if(!d||d.version!==1||!d.settings||!Array.isArray(d.resources)||!Array.isArray(d.recipes)||!Array.isArray(d.products))throw Error('ساختار پشتیبان معتبر نیست.');let ids=new Set();for(let r of d.resources){if(!r.id||ids.has(r.id)||!r.name||!units.includes(r.unit))throw Error('قلم نامعتبر یا شناسه تکراری');ids.add(r.id);fp(r.price);fp(r.adjustment);fp(r.quantity);if(!['افزایش','کاهش'].includes(r.adjustmentType)||r.adjustmentType==='کاهش'&&Number(r.adjustment)>100)throw Error('تعدیل نامعتبر')}let rid=new Set();for(let r of d.recipes){if(!r.id||rid.has(r.id)||!r.name||!Array.isArray(r.components)||fp(r.yield)<=0n)throw Error('فرمول نامعتبر');rid.add(r.id);fp(r.overhead);fp(r.factoryMarkup);for(let c of r.components){if(!ids.has(c.resourceId))throw Error('ارتباط قلم مفقود است');fp(c.qty);fp(c.waste)}}let pids=new Set();for(let p of d.products){if(!p.id||pids.has(p.id)||!p.name||!p.code||p.recipeId&&!rid.has(p.recipeId))throw Error('محصول نامعتبر');pids.add(p.id);if(fp(p.multiplier)<=0n||fp(p.discount)>100n*Q)throw Error('ضریب یا تخفیف نامعتبر');fp(p.marketMarkup);fp(p.listPrice)}}
function csv(){let quote=x=>'"'+String(x??'').replace(/^[=+\-@]/,"'$&").replaceAll('"','""')+'"';let rows=[['کد','محصول','فرمول','بهای تولید','فی هزینه‌شده محصول','قیمت کارخانه','وضعیت']];for(let p of db.products){let c=calcProduct(p);rows.push([p.code,p.name,c?.r.name||'',c?nfp(c.cost):'',c&&c.c.feeDefined?nfp(c.feeProduct):'',c?nfp(c.factory):'',p.available?'موجود':'ناموجود'])}download('afraz-products.csv','\uFEFF'+rows.map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function priceCSV(){let quote=x=>'"'+String(x??'').replace(/^[=+\-@]/,"'$&").replaceAll('"','""')+'"';let rows=[['کد محصول','نام محصول','قیمت نهایی (ریال)']];for(let p of db.products){let {final,reason}=listInfo(p);rows.push([p.code,p.name,reason||nfp(final).toFixed(2)])}download('afraz-price-list.csv','\uFEFF'+rows.map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
async function saveMarkups(ids){if(savingMarkup){notify('لطفاً تا پایان ذخیره صبر کنید');return}savingMarkup=true;try{let next=copy(),changed=[];for(let id of ids){let p=next.products.find(x=>x.id===id);if(!p||!Object.prototype.hasOwnProperty.call(markupDrafts,id))continue;let value=parseMarkup(markupDrafts[id]);p.priceMarkup=nfp(value);changed.push(id)}if(!changed.length){notify('درصد جدیدی برای ذخیره وجود ندارد');return}if(await persist(next,'ثبت درصد سود لیست برای '+changed.length+' محصول')){for(let id of changed)delete markupDrafts[id];render()}}catch(e){alert('درصد سود معتبر وارد کنید. '+e.message)}finally{savingMarkup=false}}
function markupIsCurrent(){for(let p of db.products){if(!Object.prototype.hasOwnProperty.call(markupDrafts,p.id))continue;try{if(parseMarkup(markupDrafts[p.id])!==parseMarkup(p.priceMarkup)){alert('ابتدا درصدهای تغییرکرده را با دکمه ذخیره ردیف یا «ذخیره همه تغییرات» ثبت کنید.');return false}}catch(e){alert('درصد سود معتبر وارد و ذخیره کنید.');return false}}return true}
function printPriceList(){document.body.classList.add('print-pricelist');try{window.print()}finally{setTimeout(()=>document.body.classList.remove('print-pricelist'),500)}}
async function action(a,id,el){if(a==='cloud-logout'){try{await cloudRequest('/api/logout','POST',{});location.assign('/login')}catch(e){alert(e.message)}return}else if(a==='remove-cloud-user'){let u=userList.find(x=>String(x.id)===String(id));if(u&&confirm('دسترسی «'+u.username+'» حذف شود؟ همه نشست‌های او بسته می‌شود.')){try{await cloudRequest('/api/users/'+encodeURIComponent(id),'DELETE');notify('دسترسی کاربر حذف شد');await refreshUsers()}catch(e){alert(e.message)}}return}if(a==='save-markup'){await saveMarkups([id]);return}else if(a==='save-all-markups'){await saveMarkups(Object.keys(markupDrafts));return}else if(a==='print-price-list'){if(markupIsCurrent())printPriceList();return}else if(a==='export-price-csv'){if(markupIsCurrent())priceCSV();return}if(a==='new-resource')openResource();else if(a==='edit-resource')openResource(id);else if(a==='new-recipe')openRecipe();else if(a==='edit-recipe')openRecipe(id);else if(a==='new-product')openProduct();else if(a==='edit-product')openProduct(id);else if(a==='close-modal')$('#modal').close();else if(a==='add-component'){recipeDraftFromForm();editing.draft.components.push({id:uid(),resourceId:'',qty:0,waste:0,feeSelected:false});drawRecipe()}else if(a==='remove-component'){recipeDraftFromForm();editing.draft.components.splice(Number(el.dataset.index),1);drawRecipe()}else if(a==='report-recipe'){window.reportId=id;navigate('reports')}else if(a.startsWith('delete-')){let n=copy(),item;if(a==='delete-resource'){item=getById(n.resources,id);if(n.recipes.some(r=>r.components.some(c=>c.resourceId===id)))return alert('این قلم در فرمول تولید استفاده شده است. ابتدا ارتباط آن را حذف یا جایگزین کنید.');n.resources=n.resources.filter(x=>x.id!==id)}else if(a==='delete-recipe'){item=getById(n.recipes,id);if(n.products.some(p=>p.recipeId===id))return alert('این فرمول به محصول متصل است. ابتدا ارتباط را تغییر دهید.');n.recipes=n.recipes.filter(x=>x.id!==id)}else{item=getById(n.products,id);n.products=n.products.filter(x=>x.id!==id)}if(item&&confirm('آیا «'+item.name+'» حذف شود؟'))await persist(n,'حذف '+item.name)}else if(a==='export-backup')download('afraz-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');else if(a==='import-backup')$('#restoreFile').click();else if(a==='export-csv')csv()}
document.addEventListener('change',e=>{if(e.target.matches('[data-fee-check]')&&e.target.checked){let f=$('#form');if(f&&f.elements.feeDefined)f.elements.feeDefined.value='1'}updateFeePreview()});document.addEventListener('input',e=>{if(e.target.matches('[data-product-markup]')){const id=e.target.dataset.productMarkup,pos=e.target.selectionStart;markupDrafts[id]=e.target.value;render();const next=[...document.querySelectorAll('[data-product-markup]')].find(x=>x.dataset.productMarkup===id);if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch{}}return}updateFeePreview()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-page],[data-go]');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);else if(b.dataset.go)navigate(b.dataset.go);else if(b.dataset.action)action(b.dataset.action,b.dataset.id,b)});
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>5*1024*1024)throw Error('فایل بیش از حد بزرگ است.');let d=JSON.parse(await file.text());validateData(d);migrateFee(d);migratePriceSettings(d);if(confirm('همه اطلاعات فعلی جایگزین می‌شوند. پیش از ادامه پشتیبان گرفته‌اید؟')){if(await persist(d,'بازیابی پشتیبان')){for(let k of Object.keys(markupDrafts))delete markupDrafts[k];render()}}}catch(err){alert('بازیابی انجام نشد: '+err.message)}});
function migratePriceSettings(d){let changed=false;if(d.settings.priceListMarkup===undefined){d.settings.priceListMarkup=20;changed=true}parseMarkup(d.settings.priceListMarkup);for(let p of d.products){if(p.priceMarkup===undefined){p.priceMarkup=d.settings.priceListMarkup;changed=true}else parseMarkup(p.priceMarkup)}return changed}
function migrateFee(d){let changed=false;for(let r of d.recipes){if(typeof r.feeDefined==='boolean'&&r.components.every(c=>typeof c.feeSelected==='boolean'))continue;let base=FEE_DEFAULTS[r.id];if(typeof r.feeDefined!=='boolean'){r.feeDefined=!!base;r.sourceFeeCell=base?.cell||'';r.sourceFeeFormula=base?.formula||'';changed=true}for(let c of r.components){if(typeof c.feeSelected!=='boolean'){c.feeSelected=!!base&&base.selected.includes(c.id);changed=true}}}return changed}
(async function(){try{let session=await fetch('/api/session');if(session.status===401){location.assign('/login');return}if(!session.ok)throw Error('دریافت نشست ناموفق بود');currentUser=await session.json();TOKEN=currentUser.csrf;let x=await fetch('/api/data');if(x.status===401){location.assign('/login');return}if(!x.ok)throw Error('دریافت اطلاعات ممکن نیست');dbRevision=Number(x.headers.get('X-Revision'));if(!Number.isSafeInteger(dbRevision)||dbRevision<1)throw Error('نسخه اطلاعات معتبر نیست');db=await x.json();validateData(db);let feeChanged=migrateFee(db),priceChanged=migratePriceSettings(db);if(feeChanged||priceChanged){let migrated=copy();await persist(migrated,'انتقال تنظیمات فی هزینه‌شده و لیست قیمت')}render()}catch(e){$('#title').textContent='خطا در اجرای برنامه';$('#content').innerHTML=`<div class="alert">${esc(e.message)}</div>`}})();

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | افراز پلیمر</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef4f6;color:#1b3442;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,420px);background:white;border:1px solid #dce7e9;border-radius:18px;box-shadow:0 16px 60px #153a4b16;padding:36px}.mark{width:46px;height:46px;border-radius:13px;background:#e5f4ef;color:#087b6c;display:grid;place-items:center;font-size:25px}.brand{color:#087568;font-size:21px;font-weight:bold;margin:20px 0 6px}h1{font-size:18px;margin:24px 0 8px}p{line-height:1.9;color:#748b96;font-size:12px}.alert{background:#fff1ed;color:#aa3b29;border:1px solid #f2c8bd;border-radius:8px;padding:10px;font-size:12px;margin:14px 0;line-height:1.8}label{display:block;font-size:12px;color:#4c6975;margin-top:16px}input{display:block;margin-top:7px;width:100%;border:1px solid #ccdce1;padding:12px;border-radius:8px;font:inherit;direction:ltr;text-align:left}input:focus{outline:2px solid #8bd0c4}button{margin-top:24px;width:100%;border:0;background:#087b71;color:white;border-radius:8px;padding:13px;font:inherit;cursor:pointer;font-weight:bold}.foot{border-top:1px solid #edf2f3;padding-top:17px;margin-top:24px}
</style></head><body><main class="wrap"><div class="mark">◈</div><div class="brand">افراز پلیمر</div><p>سامانه ابری محاسبه بهای تمام‌شده</p><h1>ورود به حساب کاربری</h1><p>برای دسترسی به اطلاعات و لیست قیمت وارد شوید.</p>{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="nonce" value="{{ nonce }}"><label for="username">نام کاربری</label><input id="username" name="username" autocomplete="username" required maxlength="50"><label for="password">گذرواژه</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button type="submit">ورود به سامانه</button></form><p class="foot">حساب کاربری خود را با دیگران به اشتراک نگذارید.</p></main></body></html>
